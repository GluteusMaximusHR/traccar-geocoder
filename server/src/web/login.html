<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - {brand_name}</title>
  {brand_favicon}
  <style>:root { --brand: {brand_color}; }</style>
  <style>{style}</style>
</head>
<body>
  <header class="top"><div class="in">
    <a class="logo" href="{brand_url}">{brand_logo}</a>
  </div></header>
  <div class="login-wrap"><div class="login">
    <div class="card">
      <h2>Sign in</h2>
      {error}
      <form method="post" action="/login">
        <div class="field"><label for="login">Login</label>
          <input id="login" type="text" name="login" autocomplete="username" required autofocus></div>
        <div class="field"><label for="password">Password</label>
          <input id="password" type="password" name="password" autocomplete="current-password" required></div>
        <button type="submit" class="btn wide">Sign in</button>
      </form>
    </div>
    <p class="hint">The first sign-in creates the administrator account.</p>
  </div></div>
  {brand_footer}
</body>
</html>
